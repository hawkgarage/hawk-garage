<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hawk Garage • Mão de Obra</title><style>*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial;background:#0d0d0d;color:#eee}.app{display:flex;min-height:100vh}.side{width:240px;background:#151515;border-right:1px solid #292929;padding:20px 14px;display:flex;flex-direction:column}.logo{font-size:22px;font-weight:900;padding:5px 12px 25px}.logo span{font-weight:400;color:#888}.side a{display:block;color:#aaa;text-decoration:none;padding:12px;border-radius:7px;margin:3px 0}.side a:hover,.side a.active{background:#292929;color:#fff}main{flex:1;padding:30px;max-width:1500px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0;font-size:28px}.head p{color:#888;margin:5px 0}.primary,.secondary,.add{border:0;border-radius:7px;padding:11px 15px;cursor:pointer;font-weight:700}.primary{background:#fff;color:#111}.secondary,.add{background:#292929;color:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:#181818;border:1px solid #292929;border-radius:9px}.card{padding:16px}.card small{color:#888}.card b{display:block;font-size:23px;margin-top:7px}.panel{padding:17px}.tools{display:flex;gap:9px;margin-bottom:14px}.search,select,input,textarea{background:#101010;color:#fff;border:1px solid #333;border-radius:6px;padding:10px}.search{flex:1}table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;border-bottom:1px solid #292929;text-align:left;vertical-align:top}th{color:#888;font-weight:500}.tag,.badge{background:#292929;padding:4px 7px;border-radius:5px;font-size:11px}.badge.off{color:#777}.act button{background:none;border:0;color:#aaa;cursor:pointer;font-size:16px}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}.box{width:min(900px,100%);max-height:92vh;overflow:auto;background:#191919;border:1px solid #383838;border-radius:10px;padding:22px}.mh{display:flex;justify-content:space-between}.x{background:none;border:0;color:#aaa;font-size:25px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:16px}.field label{display:block;color:#999;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%}.full{grid-column:1/-1}.prices{border:1px solid #333;border-radius:7px;padding:10px}.row{display:grid;grid-template-columns:1fr 150px 35px;gap:8px;margin-bottom:8px}.row button{background:#333;color:#fff;border:0;border-radius:5px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.empty{padding:40px;text-align:center;color:#777}.ranges{display:flex;gap:5px;flex-wrap:wrap}.ranges span{border:1px solid #333;border-radius:5px;padding:4px 6px;font-size:11px;color:#aaa}@media(max-width:800px){.side{width:65px}.logo{font-size:0}.logo:after{content:'HG';font-size:20px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.row{grid-template-columns:1fr 110px 35px}main{padding:15px}.head{align-items:flex-start;gap:10px}}
</style></head><body><div class="app"><aside class="side"><div class="logo">HAWK <span>GARAGE</span></div><a href="index.html">Produtos</a><a class="active" href="mao-de-obra.html">Mão de Obra</a><div style="margin-top:auto;color:#666;font-size:11px;padding:12px">Versão 0.6.0</div></aside><main><div class="head"><div><h1>Mão de Obra</h1><p>Cadastre serviços e preços por faixa de cilindrada.</p></div><button class="primary" onclick="novo()">+ Nova mão de obra</button></div><div class="cards"><div class="card"><small>Serviços cadastrados</small><b id="n">0</b></div><div class="card"><small>Serviços ativos</small><b id="a">0</b></div><div class="card"><small>Preço médio</small><b id="avg">R$ 0,00</b></div><div class="card"><small>Categorias</small><b id="cats">0</b></div></div><section class="panel"><div class="tools"><input id="search" class="search" placeholder="🔎 Pesquisar serviço ou categoria" oninput="render()"><select id="catfilter" onchange="render()"><option value="">Todas as categorias</option><option>Revisão</option><option>Motor</option><option>Freios</option><option>Suspensão</option><option>Elétrica</option><option>Injeção eletrônica</option><option>Transmissão</option><option>Pneus</option><option>Troca de óleo</option><option>Diagnóstico</option><option>Serviços gerais</option></select></div><div id="table"></div></section></main></div><div id="modal" class="modal"><div class="box"><div class="mh"><h2 id="title">Nova mão de obra</h2><button class="x" onclick="closeModal()">×</button></div><form onsubmit="save(event)"><input type="hidden" id="id"><div class="grid"><div class="field"><label>Código</label><input id="code" readonly></div><div class="field"><label>Categoria *</label><select id="category" required><option value="">Selecione</option><option>Revisão</option><option>Motor</option><option>Freios</option><option>Suspensão</option><option>Elétrica</option><option>Injeção eletrônica</option><option>Transmissão</option><option>Pneus</option><option>Troca de óleo</option><option>Diagnóstico</option><option>Serviços gerais</option></select></div><div class="field full"><label>Serviço *</label><input id="name" required placeholder="Ex.: Troca de óleo"></div><div class="field"><label>Tempo estimado</label><input id="time" placeholder="Ex.: 30 min"></div><div class="field"><label>Custo interno (R$)</label><input id="cost" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Margem padrão (%)</label><input id="margin" type="number" min="0" step=".1" value="60"></div><div class="field"><label>Unidade</label><select id="unit"><option>Serviço</option><option>Hora</option></select></div><div class="field full"><label>Preços por cilindrada</label><div id="prices" class="prices"></div><button type="button" class="add" onclick="addRange()">+ Adicionar faixa</button></div><div class="field full"><label>Descrição / o que está incluído</label><textarea id="description"></textarea></div><div class="field full"><label>Observações</label><textarea id="notes"></textarea></div><div class="field full"><label><input id="active" type="checkbox" checked style="width:auto"> Serviço ativo</label></div></div><div class="foot"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button class="primary">Salvar mão de obra</button></div></form></div></div><script>const KEY='hawk_garage_mao_v1';let data=JSON.parse(localStorage.getItem(KEY)||'[]');const money=x=>Number(x||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),code=()=>{let n=data.map(x=>+String(x.code||'').replace('MO-','')).filter(Number.isFinite);return'MO-'+String((n.length?Math.max(...n):0)+1).padStart(3,'0')};function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}function render(){let q=document.getElementById('search').value.toLowerCase(),c=document.getElementById('catfilter').value,a=data.filter(x=>(!c||x.category===c)&&(!q||[x.code,x.name,x.category,x.description].join(' ').toLowerCase().includes(q)));document.getElementById('n').textContent=data.length;document.getElementById('a').textContent=data.filter(x=>x.active).length;let p=data.flatMap(x=>(x.ranges||[]).map(r=>+r.price||0)).filter(Boolean);document.getElementById('avg').textContent=money(p.length?p.reduce((a,b)=>a+b,0)/p.length:0);document.getElementById('cats').textContent=new Set(data.map(x=>x.category).filter(Boolean)).size;document.getElementById('table').innerHTML=a.length?`<table><thead><tr><th>Código</th><th>Serviço</th><th>Categoria</th><th>Tempo</th><th>Preços por cilindrada</th><th>Status</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.code)}</b></td><td><b>${esc(x.name)}</b><br><small>${esc(x.description||'')}</small></td><td><span class="tag">${esc(x.category)}</span></td><td>${esc(x.time||'—')}</td><td><div class="ranges">${(x.ranges||[]).map(r=>`<span>${esc(r.range)}: <b>${money(r.price)}</b></span>`).join('')||'—'}</div></td><td><span class="badge ${x.active?'':'off'}">${x.active?'Ativo':'Inativo'}</span></td><td class="act"><button onclick="edit('${x.id}')">✏️</button><button onclick="del('${x.id}')">🗑️</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum serviço cadastrado.</div>'}function novo(){document.querySelector('form').reset();document.getElementById('id').value='';document.getElementById('code').value=code();document.getElementById('margin').value=60;document.getElementById('active').checked=true;document.getElementById('title').textContent='Nova mão de obra';document.getElementById('prices').innerHTML='';['Até 160 cc','161–250 cc','251–500 cc','501–750 cc','Acima de 750 cc'].forEach(addRange);document.getElementById('modal').classList.add('on')}function addRange(label='',price=''){let d=document.createElement('div');d.className='row';d.innerHTML=`<input class="rn" placeholder="Faixa de cilindrada" value="${esc(label)}"><input class="rp" type="number" min="0" step=".01" placeholder="Preço" value="${price}"><button type="button" onclick="this.parentElement.remove()">×</button>`;document.getElementById('prices').appendChild(d)}function save(e){e.preventDefault();let x={id:document.getElementById('id').value||uid(),code:document.getElementById('code').value||code(),category:document.getElementById('category').value,name:document.getElementById('name').value.trim(),time:document.getElementById('time').value.trim(),cost:+document.getElementById('cost').value||0,margin:+document.getElementById('margin').value||60,unit:document.getElementById('unit').value,ranges:[...document.querySelectorAll('.row')].map(r=>({range:r.querySelector('.rn').value.trim(),price:+r.querySelector('.rp').value||0})).filter(r=>r.range),description:document.getElementById('description').value.trim(),notes:document.getElementById('notes').value.trim(),active:document.getElementById('active').checked};let i=data.findIndex(y=>y.id===x.id);i<0?data.push(x):data[i]=x;persist();closeModal()}function edit(id){let x=data.find(y=>y.id===id);novo();document.getElementById('title').textContent='Editar mão de obra';document.getElementById('id').value=x.id;document.getElementById('code').value=x.code;document.getElementById('category').value=x.category;document.getElementById('name').value=x.name;document.getElementById('time').value=x.time;document.getElementById('cost').value=x.cost;document.getElementById('margin').value=x.margin;document.getElementById('unit').value=x.unit;document.getElementById('description').value=x.description;document.getElementById('notes').value=x.notes;document.getElementById('active').checked=!!x.active;document.getElementById('prices').innerHTML='';(x.ranges||[]).forEach(r=>addRange(r.range,r.price))}function del(id){let x=data.find(y=>y.id===id);if(x&&confirm('Excluir "'+x.name+'"?')){data=data.filter(y=>y.id!==id);persist()}}function closeModal(){document.getElementById('modal').classList.remove('on')}render();</script></body></html>
