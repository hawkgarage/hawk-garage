<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hawk Garage • Produtos</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#0e0e0e;color:#eee}.app{display:flex;min-height:100vh}.side{width:230px;background:#151515;border-right:1px solid #292929;padding:22px 14px}.logo{font-size:23px;font-weight:900;letter-spacing:1px;padding:5px 12px 28px}.logo span{font-weight:400;color:#888}nav button{display:block;width:100%;border:0;background:none;color:#aaa;text-align:left;padding:12px;border-radius:7px;margin:3px 0;cursor:pointer}nav button.active,nav button:hover{background:#292929;color:#fff}main{flex:1;padding:30px;max-width:1400px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.head h1{margin:0;font-size:28px}.head p{color:#888;margin:6px 0 0;font-size:13px}button{font:inherit}.primary{background:#fff;color:#111;border:0;border-radius:7px;padding:12px 16px;font-weight:700;cursor:pointer}.secondary{background:#292929;color:#fff;border:0;border-radius:7px;padding:11px 15px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card{background:#181818;border:1px solid #292929;border-radius:9px;padding:16px}.card small{color:#888}.card b{display:block;font-size:23px;margin-top:7px}.panel{background:#181818;border:1px solid #292929;border-radius:9px;padding:17px}.tools{display:flex;gap:9px;margin-bottom:12px}.search,.filter{background:#101010;color:#fff;border:1px solid #333;border-radius:6px;padding:11px}.search{flex:1}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px 9px;border-bottom:1px solid #292929;text-align:left}th{color:#888;font-weight:500}.tag{background:#292929;border-radius:4px;padding:4px 7px;font-size:11px}.low{color:#ff7373}.act button{border:0;background:none;color:#aaa;cursor:pointer;font-size:15px;margin-right:6px}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}.box{width:min(760px,100%);max-height:92vh;overflow:auto;background:#191919;border:1px solid #383838;border-radius:10px;padding:22px}.mh{display:flex;justify-content:space-between;align-items:center}.mh h2{margin:0}.x{border:0;background:none;color:#aaa;font-size:25px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:17px}.field label{display:block;color:#999;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#0e0e0e;color:#fff;border:1px solid #333;border-radius:6px;padding:10px}.field textarea{min-height:70px}.full{grid-column:1/-1}.foot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.hint{font-size:12px;color:#777;margin-top:4px}@media(max-width:800px){.side{width:70px}.logo{font-size:0}.logo:after{content:"HG";font-size:20px}nav button{font-size:0;text-align:center}nav button:before{content:"•";font-size:20px}main{padding:18px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="logo">HAWK <span>GARAGE</span></div><nav><button>Dashboard</button><button class="active">Produtos</button><button>Estoque</button><button>Clientes</button><button>Motos</button><button>Orçamentos</button><button>Ordens de Serviço</button><button>Financeiro</button></nav></aside><main><div class="head"><div><h1>Produtos</h1><p>Cadastro de óleos, peças e materiais da oficina</p></div><button class="primary" onclick="novo()">+ Novo produto</button></div><div class="cards"><div class="card"><small>Produtos cadastrados</small><b id="n">0</b></div><div class="card"><small>Unidades em estoque</small><b id="q">0</b></div><div class="card"><small>Estoque baixo</small><b id="l">0</b></div><div class="card"><small>Valor em estoque</small><b id="v">R$ 0,00</b></div></div><section class="panel"><div class="tools"><input class="search" id="search" placeholder="🔎 Pesquisar produto, marca ou código..." oninput="render()"><select class="filter" id="filter" onchange="render()"><option value="">Todas as categorias</option><option>Óleo</option><option>Filtro</option><option>Pneu</option><option>Pastilha</option><option>Vela</option><option>Bateria</option><option>Relação</option><option>Fluido</option><option>Peça</option><option>Consumível</option><option>Outro</option></select></div><div id="tbl"></div></section></main></div>
<div class="modal" id="modal"><div class="box"><div class="mh"><h2 id="mt">Novo produto</h2><button class="x" onclick="fechar()">×</button></div><form onsubmit="salvar(event)"><input type="hidden" id="id"><div class="grid"><div class="field"><label>Código</label><input id="code" readonly placeholder="Gerado automaticamente"><div class="hint">O sistema cria o código sozinho.</div></div><div class="field"><label>Categoria *</label><select id="cat" required onchange="codigo()"><option value="">Selecione</option><option>Óleo</option><option>Filtro</option><option>Pneu</option><option>Pastilha</option><option>Vela</option><option>Bateria</option><option>Relação</option><option>Fluido</option><option>Peça</option><option>Consumível</option><option>Outro</option></select></div><div class="field full"><label>Produto *</label><input id="name" required placeholder="Ex.: Motul 5100 10W40 1L"></div><div class="field"><label>Marca</label><input id="brand" placeholder="Ex.: Motul"></div><div class="field"><label>Viscosidade / especificação</label><input id="spec" placeholder="Ex.: 10W40 / JASO MA2"></div><div class="field"><label>Embalagem / unidade</label><select id="unit"><option>UN</option><option>L</option><option>ML</option><option>PAR</option><option>JOGO</option><option>KG</option></select></div><div class="field"><label>Estoque atual</label><input id="qty" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Estoque mínimo</label><input id="min" type="number" min="0" step=".01" value="1"></div><div class="field"><label>Custo (R$) *</label><input id="cost" type="number" min="0" step=".01" required oninput="preco()"></div><div class="field"><label>Margem (%)</label><input id="margin" type="number" min="0" max="99.9" step=".1" value="30" oninput="preco()"></div><div class="field"><label>Preço de venda (R$) *</label><input id="price" type="number" min="0" step=".01" required></div><div class="field"><label>Fornecedor</label><input id="supplier"></div><div class="field full"><label>Aplicações / compatibilidade</label><input id="apps" placeholder="Ex.: CB 500, XRE 300, MT-07"></div><div class="field full"><label>Observações</label><textarea id="notes"></textarea></div></div><div class="foot"><button type="button" class="secondary" onclick="fechar()">Cancelar</button><button class="primary">Salvar produto</button></div></form></div></div>
<script>
const KEY="hawk_garage_produtos_v3";let ps=JSON.parse(localStorage.getItem(KEY)||"[]");
if(!ps.length){ps=[{id:uid(),code:"OLE-001",cat:"Óleo",name:"Motul 3000+ 20W50",brand:"Motul",spec:"20W50",unit:"UN",qty:0,min:1,cost:36.9,margin:35,price:56.77,supplier:"Total Motopeças",apps:"",notes:""},{id:uid(),code:"OLE-002",cat:"Óleo",name:"Motul 5000+ 10W30",brand:"Motul",spec:"10W30",unit:"UN",qty:0,min:1,cost:44.9,margin:35,price:69.08,supplier:"Total Motopeças",apps:"",notes:""},{id:uid(),code:"OLE-003",cat:"Óleo",name:"Motul 5000+ 10W40",brand:"Motul",spec:"10W40",unit:"UN",qty:0,min:1,cost:50.6,margin:35,price:77.85,supplier:"Total Motopeças",apps:"",notes:""},{id:uid(),code:"OLE-004",cat:"Óleo",name:"Motul 5000+ 20W50",brand:"Motul",spec:"20W50",unit:"UN",qty:0,min:1,cost:51.2,margin:35,price:78.77,supplier:"Total Motopeças",apps:"",notes:""},{id:uid(),code:"OLE-005",cat:"Óleo",name:"Motul 5100 10W30",brand:"Motul",spec:"10W30",unit:"UN",qty:0,min:1,cost:68.3,margin:35,price:105.08,supplier:"Total Motopeças",apps:"",notes:""},{id:uid(),code:"OLE-006",cat:"Óleo",name:"Motul 5100 10W40",brand:"Motul",spec:"10W40",unit:"UN",qty:0,min:1,cost:72.8,margin:35,price:112,supplier:"Total Motopeças",apps:"",notes:""},{id:uid(),code:"OLE-007",cat:"Óleo",name:"Motul 7100 10W30",brand:"Motul",spec:"10W30",unit:"UN",qty:0,min:1,cost:78,margin:35,price:120,supplier:"Total Motopeças",apps:"",notes:""}];save()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function money(x){return Number(x||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}function save(){localStorage.setItem(KEY,JSON.stringify(ps));render()}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}function prefix(c){return {Óleo:"OLE",Filtro:"FIL",Pneu:"PNE",Pastilha:"PAS",Vela:"VEL",Bateria:"BAT",Relação:"REL",Fluido:"FLU",Peça:"PEC",Consumível:"CON",Outro:"OUT"}[c]||"PRO"}function gen(c){let p=prefix(c),nums=ps.filter(x=>x.code?.startsWith(p+"-")).map(x=>parseInt(x.code.split("-")[1])).filter(Number.isFinite);return p+"-"+String((nums.length?Math.max(...nums):0)+1).padStart(3,"0")}function codigo(){if(!document.getElementById("id").value)document.getElementById("code").value=gen(document.getElementById("cat").value)}function render(){let q=document.getElementById("search").value.toLowerCase(),c=document.getElementById("filter").value,a=ps.filter(p=>(!c||p.cat==c)&&(!q||[p.code,p.name,p.brand,p.spec,p.apps].join(" ").toLowerCase().includes(q)));document.getElementById("n").textContent=ps.length;document.getElementById("q").textContent=ps.reduce((s,p)=>s+Number(p.qty||0),0);document.getElementById("l").textContent=ps.filter(p=>Number(p.qty)<=Number(p.min)).length;document.getElementById("v").textContent=money(ps.reduce((s,p)=>s+Number(p.qty||0)*Number(p.cost||0),0));document.getElementById("tbl").innerHTML=a.length?`<table><thead><tr><th>Código</th><th>Produto</th><th>Categoria</th><th>Custo</th><th>Venda</th><th>Estoque</th><th></th></tr></thead><tbody>${a.map(p=>`<tr><td><b>${esc(p.code)}</b></td><td>${esc(p.name)}<br><span style="color:#777">${esc(p.brand||"")} ${p.spec?"• "+esc(p.spec):""}</span></td><td><span class="tag">${esc(p.cat)}</span></td><td>${money(p.cost)}</td><td><b>${money(p.price)}</b></td><td class="${p.qty<=p.min?'low':''}">${p.qty} ${esc(p.unit)}${p.qty<=p.min?' ⚠':''}</td><td class="act"><button onclick="editar('${p.id}')">✏️</button><button onclick="excluir('${p.id}')">🗑️</button></td></tr>`).join("")}</tbody></table>`:'<div style="padding:40px;text-align:center;color:#777">Nenhum produto encontrado.</div>'}function novo(){document.querySelector("form").reset();document.getElementById("id").value="";document.getElementById("code").value="";document.getElementById("margin").value=30;document.getElementById("mt").textContent="Novo produto";document.getElementById("modal").classList.add("on")}function fechar(){document.getElementById("modal").classList.remove("on")}function preco(){let c=+document.getElementById("cost").value||0,m=+document.getElementById("margin").value||0;if(c)document.getElementById("price").value=(c/(1-m/100)).toFixed(2)}function salvar(e){e.preventDefault();let i=document.getElementById("id").value,catv=document.getElementById("cat").value,p={id:i||uid(),code:document.getElementById("code").value||gen(catv),cat:catv,name:document.getElementById("name").value.trim(),brand:document.getElementById("brand").value.trim(),spec:document.getElementById("spec").value.trim(),unit:document.getElementById("unit").value,qty:+document.getElementById("qty").value||0,min:+document.getElementById("min").value||0,cost:+document.getElementById("cost").value||0,margin:+document.getElementById("margin").value||0,price:+document.getElementById("price").value||0,supplier:document.getElementById("supplier").value.trim(),apps:document.getElementById("apps").value.trim(),notes:document.getElementById("notes").value.trim()},ix=ps.findIndex(x=>x.id==p.id);ix>=0?ps[ix]=p:ps.push(p);save();fechar()}function editar(i){let p=ps.find(x=>x.id==i);novo();document.getElementById("mt").textContent="Editar produto";for(const k of ["id","code","cat","name","brand","spec","unit","qty","min","cost","margin","price","supplier","apps","notes"])document.getElementById(k).value=p[k]??""}function excluir(i){let p=ps.find(x=>x.id==i);if(p&&confirm("Excluir \""+p.name+"\"?")){ps=ps.filter(x=>x.id!=i);save()}}render();
</script></body></html>
