<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hawk Garage • V0.5.4</title><style>*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial;background:#0d0d0d;color:#eee}.app{display:flex;min-height:100vh}.side{width:240px;background:#151515;border-right:1px solid #292929;padding:20px 14px;display:flex;flex-direction:column}.logo{font-size:22px;font-weight:900;padding:5px 12px 25px;white-space:nowrap}.logo span{font-weight:400;color:#888}.ver{font-size:11px;color:#aaa;border:1px solid #444;border-radius:5px;padding:3px 6px;margin-left:5px}.side nav{flex:1}.side nav button{display:block;width:100%;border:0;background:none;color:#aaa;text-align:left;padding:12px;border-radius:7px;margin:3px 0}.side nav button:hover,.side nav .active{background:#292929;color:#fff}.version{color:#666;font-size:11px;padding:15px 12px 5px;border-top:1px solid #292929;line-height:1.5}main{flex:1;padding:30px;max-width:1500px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0;font-size:28px}.head p{color:#888;margin:5px 0}.primary{background:#fff;color:#111;border:0;border-radius:7px;padding:12px 16px;font-weight:700;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:#181818;border:1px solid #292929;border-radius:9px}.card{padding:16px}.card small{color:#888}.card b{display:block;font-size:23px;margin-top:7px}.panel{padding:17px}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.quick button{background:#101010;color:#aaa;border:1px solid #333;border-radius:7px;padding:9px 13px;cursor:pointer}.quick button:hover,.quick button.active{background:#fff;color:#111;border-color:#fff}.tools{display:flex;gap:9px;margin-bottom:14px}.search,.filter,input,select,textarea{background:#101010;color:#fff;border:1px solid #333;border-radius:6px;padding:10px}.search{flex:1}table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;border-bottom:1px solid #292929;text-align:left;vertical-align:top}th{color:#888;font-weight:500}.tag{background:#292929;padding:4px 7px;border-radius:4px;font-size:11px}.low{color:#f66}.act button{background:none;border:0;color:#aaa;cursor:pointer;font-size:16px}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}.box{width:min(820px,100%);max-height:92vh;overflow:auto;background:#191919;border:1px solid #383838;border-radius:10px;padding:22px}.mh{display:flex;justify-content:space-between}.x{background:none;border:0;color:#aaa;font-size:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:16px}.field label{display:block;color:#999;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%}.full{grid-column:1/-1}.suppliers{border:1px solid #333;border-radius:7px;padding:10px}.supplier{display:grid;grid-template-columns:1fr 150px 35px;gap:8px;margin-bottom:8px}.supplier button{background:#333;color:#fff;border:0;border-radius:5px}.addsup{background:#292929;color:#fff;border:0;padding:8px 10px;border-radius:5px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.secondary{background:#292929;color:#fff;border:0;border-radius:7px;padding:11px 15px}.apps{color:#aaa;font-size:12px;line-height:1.45;max-width:420px}@media(max-width:800px){.side{width:65px}.logo{font-size:0}.logo:after{content:'HG';font-size:20px}.ver{font-size:0;border:0;margin:0}.ver:after{content:'V0.5.4';font-size:10px}.version{font-size:0;text-align:center}.version:after{content:'V0.5.4';font-size:11px}.side nav button{font-size:0;text-align:center}main{padding:15px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.supplier{grid-template-columns:1fr 110px 35px}}
</style></head><body><div class="app"><aside class="side"><div class="logo">HAWK <span>GARAGE</span><span class="ver">V0.5.4</span></div><nav><button>Dashboard</button><button class="active">Produtos</button><button>Estoque</button><button>Clientes</button><button>Motos</button><button>Orçamentos</button><button>Ordens de Serviço</button><button>Financeiro</button></nav><div class="version"><b>Versão 0.5.4</b><br>Atualizado em 13/08/2026</div></aside><main><div class="head"><div><h1>Produtos</h1><p>Cadastro de óleos, filtros, peças e materiais</p></div><button class="primary" onclick="novo()">+ Novo produto</button></div><div class="cards"><div class="card"><small>Produtos cadastrados</small><b id="n">0</b></div><div class="card"><small>Unidades em estoque</small><b id="q">0</b></div><div class="card"><small>Estoque baixo</small><b id="l">0</b></div><div class="card"><small>Valor em estoque</small><b id="v">R$ 0,00</b></div></div><section class="panel"><div class="quick"><button data-cat="" class="active" onclick="setCat(this,'')">📦 Todos</button><button data-cat="Óleo" onclick="setCat(this,'Óleo')">🛢️ Óleos</button><button data-cat="Filtro de óleo" onclick="setCat(this,'Filtro de óleo')">🔧 Filtros</button><button data-cat="Pneu" onclick="setCat(this,'Pneu')">🛞 Pneus</button><button data-cat="Peça" onclick="setCat(this,'Peça')">⚙️ Peças</button><button data-cat="Fluido" onclick="setCat(this,'Fluido')">🧴 Fluidos</button></div><div class="tools"><input id="search" class="search" placeholder="🔎 Pesquisar produto, grupo, moto ou código" oninput="render()"><select id="filter" class="filter" onchange="syncCat();render()"><option value="">Todas as categorias</option><option>Óleo</option><option>Filtro de óleo</option><option>Filtro</option><option>Pneu</option><option>Pastilha</option><option>Vela</option><option>Bateria</option><option>Relação</option><option>Fluido</option><option>Peça</option><option>Consumível</option><option>Outro</option></select></div><div id="tbl"></div></section></main></div><div id="modal" class="modal"><div class="box"><div class="mh"><h2 id="mt">Novo produto</h2><button class="x" onclick="fechar()">×</button></div><form onsubmit="salvar(event)"><input type="hidden" id="id"><div class="grid"><div class="field"><label>Código</label><input id="code" readonly></div><div class="field"><label>Categoria *</label><select id="cat" required onchange="codigo()"><option value="">Selecione</option><option>Óleo</option><option>Filtro de óleo</option><option>Filtro</option><option>Pneu</option><option>Pastilha</option><option>Vela</option><option>Bateria</option><option>Relação</option><option>Fluido</option><option>Peça</option><option>Consumível</option><option>Outro</option></select></div><div class="field full"><label>Produto *</label><input id="name" required></div><div class="field"><label>Marca</label><input id="brand"></div><div class="field"><label>Viscosidade / especificação</label><input id="spec"></div><div class="field"><label>Tipo de óleo</label><select id="oilType"><option value="">Não se aplica</option><option>Mineral</option><option>Semissintético</option><option>Sintético</option></select></div><div class="field"><label>Unidade</label><select id="unit"><option>UN</option><option>L</option><option>ML</option><option>PAR</option><option>JOGO</option></select></div><div class="field"><label>Estoque atual</label><input id="qty" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Estoque mínimo</label><input id="min" type="number" min="0" step=".01" value="1"></div><div class="field"><label>Margem (%)</label><input id="margin" type="number" value="35" step=".1" oninput="preco()"></div><div class="field"><label>Preço de venda (R$)</label><input id="price" type="number" step=".01" required></div><div class="field full"><label>Fornecedores e custos de compra</label><div class="suppliers" id="suppliers"></div><button type="button" class="addsup" onclick="addSupplier()">+ Adicionar fornecedor</button></div><div class="field full"><label>Aplicações / compatibilidade</label><input id="apps"></div><div class="field full"><label>Observações</label><textarea id="notes"></textarea></div></div><div class="foot"><button type="button" class="secondary" onclick="fechar()">Cancelar</button><button class="primary">Salvar produto</button></div></form></div></div><script>
const KEY='hawk_garage_produtos_v5';let ps=JSON.parse(localStorage.getItem(KEY)||'[]');let currentCat='';
const oilType=n=>{let s=n.toLowerCase();if(s.includes('3000+'))return'Mineral';if(s.includes('5000+')||s.includes('5100'))return'Semissintético';if(s.includes('7100'))return'Sintético';return''};
ps.forEach(p=>{if(p.cat==='Óleo'){if(!/^óleo\s/i.test(p.name))p.name='Óleo '+p.name;p.oilType=p.oilType||oilType(p.name)}});localStorage.setItem(KEY,JSON.stringify(ps));
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function money(x){return Number(x||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function save(){localStorage.setItem(KEY,JSON.stringify(ps));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function pref(c){return {'Óleo':'OLE','Filtro de óleo':'FO','Filtro':'FIL','Pneu':'PNE','Pastilha':'PAS','Vela':'VEL','Bateria':'BAT','Relação':'REL','Fluido':'FLU','Peça':'PEC','Consumível':'CON','Outro':'OUT'}[c]||'PRO'}function gen(c){let p=pref(c),a=ps.filter(x=>x.code?.startsWith(p+'-')).map(x=>+x.code.split('-')[1]).filter(Number.isFinite);return p+'-'+String((a.length?Math.max(...a):0)+1).padStart(3,'0')}function codigo(){if(!document.getElementById('id').value)document.getElementById('code').value=gen(document.getElementById('cat').value)}function setCat(btn,c){currentCat=c;document.getElementById('filter').value=c;document.querySelectorAll('.quick button').forEach(b=>b.classList.toggle('active',b===btn));render()}function syncCat(){currentCat=document.getElementById('filter').value;document.querySelectorAll('.quick button').forEach(b=>b.classList.toggle('active',b.dataset.cat===currentCat))}function render(){let q=document.getElementById('search').value.toLowerCase(),c=currentCat,a=ps.filter(p=>(!c||p.cat==c)&&(!q||[p.code,p.name,p.brand,p.spec,p.apps,p.oilType].join(' ').toLowerCase().includes(q)));document.getElementById('n').textContent=ps.length;document.getElementById('q').textContent=ps.reduce((s,p)=>s+(+p.qty||0),0);document.getElementById('l').textContent=ps.filter(p=>(+p.qty||0)<=(+p.min||0)).length;document.getElementById('v').textContent=money(ps.reduce((s,p)=>s+(+p.qty||0)*(+p.suppliers?.[0]?.cost||0),0));document.getElementById('tbl').innerHTML=a.length?`<table><thead><tr><th>Código</th><th>Produto</th><th>Categoria</th><th>Tipo</th><th>Fornecedor / custo</th><th>Venda</th><th>Estoque</th><th>Aplicações</th><th></th></tr></thead><tbody>${a.map(p=>`<tr><td><b>${esc(p.code)}</b></td><td>${esc(p.name)}<br><span style="color:#777">${esc(p.brand||'')} ${p.spec?'• '+esc(p.spec):''}</span></td><td><span class="tag">${esc(p.cat)}</span></td><td>${p.oilType?esc(p.oilType):'—'}</td><td>${p.oilType?esc(p.oilType):'—'}</td><td>${p.oilType?esc(p.oilType):'—'}</td><td>${(p.suppliers||[]).map(s=>esc(s.name)+': '+money(s.cost)).join('<br>')||'—'}</td><td><b>${p.price?money(p.price):'—'}</b></td><td class="${p.qty<=p.min?'low':''}">${p.qty} ${p.unit}</td><td class="apps">${esc(p.apps||'—')}</td><td class="act"><button onclick="editar('${p.id}')">✏️</button><button onclick="excluir('${p.id}')">🗑️</button></td></tr>`).join('')}</tbody></table>`:'<div style="padding:40px;text-align:center;color:#777">Nenhum produto encontrado.</div>'}function novo(){document.querySelector('form').reset();document.getElementById('id').value='';document.getElementById('code').value='';document.getElementById('margin').value=35;document.getElementById('mt').textContent='Novo produto';document.getElementById('suppliers').innerHTML='';addSupplier();document.getElementById('modal').classList.add('on')}function fechar(){document.getElementById('modal').classList.remove('on')}function addSupplier(name='',cost=''){let d=document.createElement('div');d.className='supplier';d.innerHTML=`<input class="sn" placeholder="Fornecedor" value="${esc(name)}"><input class="sc" type="number" step=".01" min="0" placeholder="Custo" value="${cost}"><button type="button" onclick="this.parentElement.remove()">×</button>`;document.getElementById('suppliers').appendChild(d)}function preco(){let vals=[...document.querySelectorAll('.sc')].map(x=>+x.value).filter(x=>x>0),m=+document.getElementById('margin').value||35;if(vals.length)document.getElementById('price').value=(Math.min(...vals)/(1-m/100)).toFixed(2)}function salvar(e){e.preventDefault();let su=[...document.querySelectorAll('.supplier')].map(d=>({name:d.querySelector('.sn').value.trim(),cost:+d.querySelector('.sc').value||0})).filter(x=>x.name),catv=document.getElementById('cat').value,nm=document.getElementById('name').value.trim();if(catv==='Óleo'&&!/^óleo\s/i.test(nm))nm='Óleo '+nm;let p={id:document.getElementById('id').value||uid(),code:document.getElementById('code').value||gen(catv),cat:catv,name:nm,brand:document.getElementById('brand').value.trim(),spec:document.getElementById('spec').value.trim(),oilType:catv==='Óleo'?(document.getElementById('oilType').value||oilType(nm)):'',unit:document.getElementById('unit').value,qty:+document.getElementById('qty').value||0,min:+document.getElementById('min').value||0,margin:+document.getElementById('margin').value||35,price:+document.getElementById('price').value||0,suppliers:su,apps:document.getElementById('apps').value.trim(),notes:document.getElementById('notes').value.trim()};let i=ps.findIndex(x=>x.id==p.id);i>=0?ps[i]=p:ps.push(p);save();fechar()}function editar(i){let p=ps.find(x=>x.id==i);if(!p)return;novo();document.getElementById('mt').textContent='Editar produto';document.getElementById('id').value=p.id;document.getElementById('code').value=p.code;document.getElementById('cat').value=p.cat;document.getElementById('name').value=p.name;document.getElementById('brand').value=p.brand;document.getElementById('spec').value=p.spec;document.getElementById('oilType').value=p.oilType||oilType(p.name);document.getElementById('unit').value=p.unit;document.getElementById('qty').value=p.qty;document.getElementById('min').value=p.min;document.getElementById('margin').value=p.margin;document.getElementById('price').value=p.price;document.getElementById('apps').value=p.apps;document.getElementById('notes').value=p.notes;document.getElementById('suppliers').innerHTML='';(p.suppliers||[]).forEach(s=>addSupplier(s.name,s.cost))}function excluir(i){let p=ps.find(x=>x.id==i);if(p&&confirm('Excluir "'+p.name+'"?')){ps=ps.filter(x=>x.id!=i);save()}}const oilTypes={'Motul 3000+ 20W50':'Mineral','Motul 5000+ 10W30':'Semi-sintético','Motul 5000+ 10W40':'Semi-sintético','Motul 5000+ 20W50':'Semi-sintético','Motul 5100 10W30':'Semi-sintético','Motul 5100 10W40':'Semi-sintético','Motul 5100 10W50':'Semi-sintético','Motul 5100 15W50':'Semi-sintético','Motul 7100 10W30':'Sintético','Motul 7100 5W40':'Sintético'};ps.forEach(p=>{let base=p.name.replace(/^Óleo /,'');if(p.cat==='Óleo'&&oilTypes[base]){p.name='Óleo '+base;p.oilType=oilTypes[base]}});localStorage.setItem(KEY,JSON.stringify(ps));
render();</script></body></html>
